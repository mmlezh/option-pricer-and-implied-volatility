name: Homework build, test, benchmark and documentation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ cmake make doxygen
      - name: Configure
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: make -C build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark (results also printed in log)
        run: ./build/pricing_bench --benchmark_min_time=0.02s --benchmark_out=build/benchmark.json --benchmark_out_format=json
      - name: Demonstration
        run: ./build/pricing_demo
      - name: Documentation
        run: make -C build docs
      - name: Repeat configuration and run without network
        run: |
          sudo unshare --net -- sh -eu -c '
            cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
            make -C build -j2
            ctest --test-dir build --output-on-failure
            ./build/pricing_demo
            ./build/pricing_bench --benchmark_min_time=0.02s
            make -C build docs
          '
      - name: Check Pages configuration
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.get(context.repo);
            core.setOutput('enabled', String(data.has_pages));
            if (!data.has_pages) {
              await core.summary.addRaw('Pages is disabled. Enable Settings → Pages → GitHub Actions, then rerun all jobs. Documentation was generated but is not published.').write();
            }
      - uses: actions/upload-artifact@v4
        with:
          name: homework-verification
          path: |
            build/benchmark.json
            build/Testing/Temporary/LastTest.log
            build/docs/html
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: build/docs/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.pages_enabled == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
